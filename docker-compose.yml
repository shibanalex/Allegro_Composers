# Allegro — distributed monolith: five FastAPI services + Nuxt SSR behind one nginx gateway,
# all services share one PostgreSQL database and one media volume.
#
#   docker compose up --build                          → http://localhost:8080
#   docker compose run --rm migrate python -m scripts.seed   (demo content)

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://allegro:allegro@postgres:5432/allegro
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
  MEDIA_DIR: /data/media
  CORS_ORIGINS: http://localhost:8080

x-service: &service
  environment: *backend-env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: allegro
      POSTGRES_USER: allegro
      POSTGRES_PASSWORD: allegro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allegro -d allegro"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ./backend, dockerfile: migrations/Dockerfile }
    environment: *backend-env
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    <<: *service
    build: { context: ./backend, dockerfile: services/identity/Dockerfile }

  catalog:
    <<: *service
    build: { context: ./backend, dockerfile: services/catalog/Dockerfile }
    volumes:
      - media:/data/media  # score downloads, file cleanup

  content:
    <<: *service
    build: { context: ./backend, dockerfile: services/content/Dockerfile }
    volumes:
      - media:/data/media  # attachment cleanup

  discussion:
    <<: *service
    build: { context: ./backend, dockerfile: services/discussion/Dockerfile }

  media:
    <<: *service
    build: { context: ./backend, dockerfile: services/media/Dockerfile }
    volumes:
      - media:/data/media

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL: http://gateway  # server-side rendering talks to the API through the gateway

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - media:/srv/media:ro
    depends_on: [identity, catalog, content, discussion, media, frontend]

volumes:
  postgres_data:
  media:
