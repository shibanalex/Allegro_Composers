# Allegro locally, the way it runs in production: the site container (Dockerfile: Nuxt + the FastAPI
# modular monolith), PostgreSQL, and MinIO standing in for the S3 storage (Yandex Object Storage).
#
#   SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))") docker compose up --build
#   → http://localhost:3000, first account at http://localhost:3000/setup (code: SETUP_TOKEN below)
#
# For everyday development the plain local setup is lighter (docs/DEVELOPMENT.md).

services:
  site:
    build: .
    ports:
      - "3000:3000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (48+ random characters) before starting}
      DATABASE_URL: postgresql://allegro:allegro@postgres:5432/allegro
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: allegro
      S3_ACCESS_KEY_ID: allegro-minio
      S3_SECRET_ACCESS_KEY: allegro-minio-secret
      MEDIA_URL_PREFIX: http://localhost:9000/allegro
      PUBLIC_URL: http://localhost:3000  # the chat's WebSocket accepts pages of this address
      SETUP_TOKEN: ${SETUP_TOKEN:-local-setup-code-please-change}
    depends_on:
      postgres:
        condition: service_healthy
      bucket:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: allegro
      POSTGRES_USER: allegro
      POSTGRES_PASSWORD: allegro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allegro -d allegro"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: allegro-minio
      MINIO_ROOT_PASSWORD: allegro-minio-secret
    volumes:
      - minio_data:/data

  # Creates the public-read bucket once (like «Публичный доступ на чтение» in Yandex Object Storage)
  bucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 allegro-minio allegro-minio-secret; do sleep 1; done &&
             mc mb --ignore-existing local/allegro && mc anonymous set download local/allegro"

volumes:
  postgres_data:
  minio_data:
