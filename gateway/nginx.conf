# API gateway: routes each path to the service that owns it; everything else goes to Nuxt (SSR)
upstream identity   { server identity:8000; }
upstream catalog    { server catalog:8000; }
upstream content    { server content:8000; }
upstream discussion { server discussion:8000; }
upstream media      { server media:8000; }
upstream frontend   { server frontend:3000; }

server {
    listen 80;
    client_max_body_size 200m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/api/(auth|users)(/|$)                     { proxy_pass http://identity; }
    location ~ ^/api/(opuses|collections|library|search)(/|$) { proxy_pass http://catalog; }
    location ~ ^/api/(posts|materials)(/|$)                { proxy_pass http://content; }
    location ~ ^/api/comments(/|$)                         { proxy_pass http://discussion; }
    location ~ ^/api/media(/|$)                            { proxy_pass http://media; }

    # Uploaded files straight from the shared volume (supports Range requests for audio seeking)
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
