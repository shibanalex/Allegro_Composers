# API gateway: routes each path to the service that owns it; everything else goes to Nuxt (SSR)
upstream identity   { server identity:8000; }
upstream catalog    { server catalog:8000; }
upstream content    { server content:8000; }
upstream discussion { server discussion:8000; }
upstream media      { server media:8000; }
upstream frontend   { server frontend:3000; }

server {
    listen 80;
    client_max_body_size 200m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server_tokens off;
    # The whole site: no framing by other sites (clickjacking), no MIME sniffing, no full URLs in Referer
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/api/(auth|users)(/|$)                     { proxy_pass http://identity; }
    location ~ ^/api/(opuses|collections|library|search)(/|$) { proxy_pass http://catalog; }
    location ~ ^/api/(posts|materials)(/|$)                { proxy_pass http://content; }
    location ~ ^/api/comments(/|$)                         { proxy_pass http://discussion; }
    location ~ ^/api/media(/|$)                            { proxy_pass http://media; }

    # Uploaded files straight from the shared volume (supports Range requests for audio seeking)
    # Uploaded files come from users: never run one as a page on this origin (same as MEDIA_HEADERS in the backend).
    # add_header here replaces the server-level ones, so they are repeated.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
